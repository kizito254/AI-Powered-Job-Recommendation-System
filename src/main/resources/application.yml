spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/job_recommendation}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

server:
  port: 8080
